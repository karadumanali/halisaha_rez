<!-- ══ ŞİFRE DEĞİŞTİR MODAL — body'nin doğrudan çocuğu olarak ══ -->
<div id="pwModal" class="pw-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pwModalTitle">
    <div class="pw-modal-box">

        <div class="pw-modal-header">
            <div class="pw-modal-icon"><i class="fas fa-key"></i></div>
            <div>
                <div class="pw-modal-title" id="pwModalTitle">Şifre Değiştir</div>
                <div class="pw-modal-sub">Güvenli bir şifre belirleyin</div>
            </div>
            <button class="pw-modal-close" id="btnClosePwModal" aria-label="Kapat">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="pw-policy-box">
            <div class="pw-policy-title">
                <i class="fas fa-shield-alt"></i> Şifre Gereksinimleri
            </div>
            <ul class="pw-check-list">
                <li id="chkLen"><i class="fas fa-circle"></i> En az <strong>10 karakter</strong></li>
                <li id="chkUpper"><i class="fas fa-circle"></i> En az <strong>1 büyük harf</strong> (A-Z)</li>
                <li id="chkLower"><i class="fas fa-circle"></i> En az <strong>1 küçük harf</strong> (a-z)</li>
                <li id="chkDigit"><i class="fas fa-circle"></i> En az <strong>1 rakam</strong> (0-9)</li>
                <li id="chkSpecial"><i class="fas fa-circle"></i> En az <strong>1 özel karakter</strong> (!@#$%^&* vb.)</li>
            </ul>
        </div>

        <form action="/admin/change_password" method="POST" id="pwForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="pw-field">
                <label class="pw-label" for="currentPwInput">Mevcut Şifre</label>
                <input type="password" id="currentPwInput" name="current_password"
                       class="pw-input" required placeholder="Mevcut şifrenizi girin">
            </div>

            <div class="pw-field">
                <label class="pw-label" for="newPwInput">Yeni Şifre</label>
                <input type="password" id="newPwInput" name="new_password"
                       class="pw-input" required placeholder="Yeni şifrenizi girin">
                <div class="pw-strength-bar">
                    <div class="pw-strength-fill" id="pwStrengthFill"></div>
                </div>
                <div class="pw-strength-text" id="pwStrengthText"></div>
            </div>

            <div class="pw-field">
                <label class="pw-label" for="confirmPwInput">Yeni Şifre (Tekrar)</label>
                <input type="password" id="confirmPwInput" name="confirm_password"
                       class="pw-input" required placeholder="Yeni şifrenizi tekrar girin">
                <div class="pw-match-msg" id="pwMatchMsg"></div>
            </div>

            <div class="pw-modal-actions">
                <button type="button" class="pw-btn-cancel" id="btnCancelPw">İptal</button>
                <button type="submit" class="pw-btn-submit" id="btnPwSubmit" disabled>
                    <i class="fas fa-key"></i> Şifreyi Değiştir
                </button>
            </div>
        </form>

    </div>
</div>
