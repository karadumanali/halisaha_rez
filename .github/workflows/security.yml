name: 🔒 Güvenlik Taraması

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  # Her Pazartesi 03:00'te otomatik tarama
  schedule:
    - cron: '0 3 * * 1'

jobs:

  # ══════════════════════════════════════════════
  # 1. BANDIT — Python kaynak kodu güvenlik taraması
  # ══════════════════════════════════════════════
  bandit:
    name: 🐍 Bandit — Kod Taraması
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bandit kur
        run: pip install bandit[toml]

      - name: Bandit taraması çalıştır
        run: |
          bandit -r . \
            --exclude ./.venv,./backups,./static \
            --severity-level medium \
            --confidence-level medium \
            -f json \
            -o bandit-report.json || true

      - name: Raporu göster
        if: always()
        run: |
          pip install bandit[toml] -q
          bandit -r . \
            --exclude ./.venv,./backups,./static \
            --severity-level medium \
            --confidence-level medium || true

      - name: Raporu artifact olarak kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30


  # ══════════════════════════════════════════════
  # 2. SAFETY — Bağımlılık güvenlik açığı taraması
  # ══════════════════════════════════════════════
  safety:
    name: 📦 Safety — Bağımlılık Taraması
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları ve Safety'i kur
        run: |
          pip install safety
          pip install -r requirements.txt

      - name: Safety taraması çalıştır
        run: |
          safety check \
            --full-report \
            --output json \
            -r requirements.txt \
            > safety-report.json || true

      - name: Kritik açıkları göster
        if: always()
        run: safety check -r requirements.txt --full-report || true

      - name: Raporu artifact olarak kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 30


  # ══════════════════════════════════════════════
  # 3. OWASP ZAP — Çalışan uygulamaya aktif tarama
  # ══════════════════════════════════════════════
  zap:
    name: 🕷️ OWASP ZAP — Web Uygulama Taraması
    runs-on: ubuntu-latest
    # Sadece main/master'a push'ta çalışsın (PR'larda atla — yavaş)
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Test .env oluştur
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-test-secret-key-not-for-production-32chars
          DATABASE_URL=sqlite:///test_ci.db
          FLASK_ENV=development
          FLASK_DEBUG=False
          EOF

      - name: Flask uygulamasını başlat
        run: |
          python app.py &
          echo $! > flask.pid
          # Uygulamanın ayağa kalkması için bekle
          sleep 8
          curl -f http://127.0.0.1:5000/ || (echo "Flask başlatılamadı!" && exit 1)

      - name: OWASP ZAP Baseline Taraması
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://127.0.0.1:5000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false   # Açık bulunsa bile workflow'u durdurma, rapor ver
          allow_issue_writing: false

      - name: Flask'ı durdur
        if: always()
        run: |
          if [ -f flask.pid ]; then
            kill $(cat flask.pid) 2>/dev/null || true
          fi

      - name: ZAP raporunu artifact olarak kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30


  # ══════════════════════════════════════════════
  # 4. ÖZET — Tüm taramalar bitince sonuç bildir
  # ══════════════════════════════════════════════
  summary:
    name: 📊 Tarama Özeti
    runs-on: ubuntu-latest
    needs: [bandit, safety]
    if: always()
    steps:
      - name: Sonuçları değerlendir
        run: |
          echo "================================"
          echo "  GÜVENLİK TARAMA SONUÇLARI"
          echo "================================"
          echo "Bandit  : ${{ needs.bandit.result }}"
          echo "Safety  : ${{ needs.safety.result }}"
          echo "================================"
          echo "Raporları Actions > Artifacts"
          echo "bölümünden indirebilirsiniz."